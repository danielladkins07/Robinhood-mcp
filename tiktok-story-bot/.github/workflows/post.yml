name: Post TikTok story

on:
  schedule:
    # Times are UTC. 15:00 and 23:00 UTC = 11am and 7pm New York (EDT).
    - cron: "0 15,23 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual posts

permissions:
  contents: write         # to move used stories into stories/done

concurrency:
  group: tiktok-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Make and upload video
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIVACY_LEVEL: ${{ vars.PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
          HASHTAGS: ${{ vars.HASHTAGS || '#storytime #redditstories #fyp' }}
          STORY_SOURCE: ${{ vars.STORY_SOURCE || 'auto' }}
        run: python main.py post

      # TikTok may hand back a new refresh token; save it so the next run still works.
      - name: Save rotated TikTok refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f tokens.json ] && [ -n "$GH_TOKEN" ]; then
            python -c "import json;print(json.load(open('tokens.json'))['refresh_token'])" \
              | gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          fi
          rm -f tokens.json

      - name: Record used story
        if: success()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add -A stories
          git diff --cached --quiet || (git commit -m "Posted story" && git push)

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 7
